<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mis Tareas Universidad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }
        h1 { color: #333; font-size: 24px; text-align: center; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #218838; }
        ul { list-style: none; padding: 0; }
        li { background: #eee; margin-top: 8px; padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
        .btn-borrar { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Mi Lista de Tareas</h1>
        <div class="input-group">
            <input type="text" id="nuevaTarea" placeholder="Escribe una tarea...">
            <button onclick="agregarTarea()">Guardar</button>
        </div>
        <ul id="listaTareas"></ul>
    </div>

    <script>
        // Carga las tareas apenas abre la página
        document.addEventListener("DOMContentLoaded", renderizarTareas);

        function obtenerTareas() {
            return JSON.parse(localStorage.getItem("tareas")) || [];
        }

        function agregarTarea() {
            let input = document.getElementById("nuevaTarea");
            let texto = input.value.trim();
            if (texto === "") return;

            let tareas = obtenerTareas();
            tareas.push(texto);
            localStorage.setItem("tareas", JSON.stringify(tareas));

            input.value = "";
            renderizarTareas();
        }

        function eliminarTarea(index) {
            let tareas = obtenerTareas();
            tareas.splice(index, 1);
            localStorage.setItem("tareas", JSON.stringify(tareas));
            renderizarTareas();
        }

        function renderizarTareas() {
            let lista = document.getElementById("listaTareas");
            lista.innerHTML = "";
            let tareas = obtenerTareas();

            tareas.forEach((tarea, index) => {
                let li = document.createElement("li");
                li.innerHTML = `
                    <span>${tarea}</span>
                    <button class="btn-borrar" onclick="eliminarTarea(${index})">X</button>
                `;
                lista.appendChild(li);
            });
        }
    </script>
</body>
</html>
